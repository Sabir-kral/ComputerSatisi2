<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | TechStore</title>
    <style>
        body {
            margin: 0; background: #0d1117; color: #c9d1d9;
            font-family: 'Segoe UI', sans-serif; min-height: 100vh;
            display: flex; justify-content: center; padding: 40px 20px; box-sizing: border-box;
        }
        .container { width: 100%; max-width: 700px; }
        .card {
            background: #161b22; border: 1px solid #30363d; border-radius: 15px;
            padding: 35px; margin-bottom: 20px;
        }
        h2 { color: #ff7b00; margin-top: 0; }
        h3.section-title { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }

        .button-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px;
        }
        .btn {
            padding: 14px; border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; font-size: 0.95rem; transition: 0.2s; color: white;
        }
        .btn:hover { opacity: 0.85; transform: translateY(-2px); }
        .btn-full { grid-column: 1 / -1; }

        .btn-back {
            background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
        }
        .btn-back:hover { background: #30363d; }

        .list-item {
            background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
            padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s;
        }
        .list-item:hover { border-color: #58a6ff; }
        .list-item.banned { border-left: 4px solid #da3633; }

        .badge {
            font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; font-weight: bold;
        }
        .badge-banned { background: #da3633; color: white; }
        .badge-active { background: #238636; color: white; }

        input, textarea {
            width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;
            font-family: inherit;
        }

        .action-btn {
            padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        .detail-row { padding: 10px 0; border-bottom: 1px solid #21262d; }
        .detail-row strong { color: #8b949e; }

        #loading-msg { text-align: center; color: #8b949e; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="admin-home">
        <button class="btn-back" onclick="location.href='index.html'">← Ana Səhifə</button>
        <h2>🛠️ Admin Panel</h2>
        <div class="button-group">
            <button class="btn" style="background:#49fb35; color:#000;" onclick="location.href='add-computer.html'">Kompüter Əlavə Et</button>
            <button class="btn" style="background:#f78166;" onclick="showUserList()">İstifadəçiləri İdarə Et</button>
            <button class="btn" style="background:#da3633;" onclick="showComputerList()">Kompüterləri Sil / Redaktə</button>
            <button class="btn" style="background:#8957e5;" onclick="showAddAdmin()">Admin Təyin Et</button>
        </div>
    </div>

    <!-- İSTİFADƏÇİ SİYAHISI -->
    <div class="card" id="user-list-view" style="display:none;">
        <button class="btn-back" onclick="backToHome()">← Geri</button>
        <h3 class="section-title">Bloklanmış İstifadəçilər</h3>
        <div id="banned-users-list"><p id="loading-msg">Yüklənir...</p></div>

        <h3 class="section-title" style="margin-top:30px;">Bütün İstifadəçilər</h3>
        <div id="all-users-list"></div>
    </div>

    <!-- İSTİFADƏÇİ DETAL -->
    <div class="card" id="user-detail-view" style="display:none;">
        <button class="btn-back" onclick="backToUserList()">← Geri</button>
        <h3 class="section-title">İstifadəçi Məlumatları</h3>
        <div class="detail-row"><strong>ID:</strong> <span id="ud-id"></span></div>
        <div class="detail-row"><strong>Ad:</strong> <span id="ud-name"></span></div>
        <div class="detail-row"><strong>Soyad:</strong> <span id="ud-surname"></span></div>
        <div class="detail-row"><strong>Email:</strong> <span id="ud-email"></span></div>
        <div class="detail-row"><strong>Status:</strong> <span id="ud-status"></span></div>

        <div class="button-group" style="margin-top:25px;">
            <button class="btn" style="background:#58a6ff;" onclick="showEditUser()">Redaktə</button>
            <button class="btn" id="ban-toggle-btn" style="background:#da3633;" onclick="toggleBan()">Banla</button>
        </div>

        <div id="edit-user-form" style="display:none; margin-top:25px; border-top:1px solid #30363d; padding-top:20px;">
            <h3 class="section-title">Məlumatları Redaktə Et</h3>
            <input type="text" id="edit-name" placeholder="Ad">
            <input type="text" id="edit-surname" placeholder="Soyad">
            <input type="email" id="edit-email" placeholder="Email">
            <div class="button-group">
                <button class="btn" style="background:#49fb35; color:#000;" onclick="saveUserEdit()">Kaydet</button>
                <button class="btn" style="background:#21262d; border:1px solid #30363d;" onclick="document.getElementById('edit-user-form').style.display='none'">Ləğv Et</button>
            </div>
        </div>
    </div>

    <!-- KOMPÜTER SİYAHISI -->
    <div class="card" id="computer-list-view" style="display:none;">
        <button class="btn-back" onclick="backToHome()">← Geri</button>
        <h3 class="section-title">Bütün Kompüterlər</h3>
        <div id="admin-computer-list"><p id="loading-msg">Yüklənir...</p></div>
    </div>

    <!-- ADMIN TƏYİN ET -->
    <div class="card" id="add-admin-view" style="display:none;">
        <button class="btn-back" onclick="backToHome()">← Geri</button>
        <h3 class="section-title">Yeni Admin Təyin Et</h3>

        <p style="color:#8b949e;">Mövcud istifadəçilərdən seç:</p>
        <select id="admin-user-select" style="width:100%; padding:12px; margin-bottom:15px; background:#0d1117; color:white; border:1px solid #30363d; border-radius:6px;">
            <option value="">-- Yüklənir... --</option>
        </select>
        <button class="btn btn-full" style="background:#8957e5; margin-bottom:20px;" onclick="promoteSelected()">Seçilmiş İstifadəçini Admin Et</button>

        <p style="color:#8b949e;">Və ya email yaz:</p>
        <input type="email" id="admin-custom-email" placeholder="istifadeci@gmail.com">
        <button class="btn btn-full" style="background:#8957e5;" onclick="promoteCustomEmail()">Bu Email-i Admin Et</button>
    </div>
</div>

<!-- Kompüter Redaktə Modalı -->
<div id="updateComputerModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(13,17,23,0.97); z-index:10001; justify-content:center; align-items:center;">
    <div style="background:#161b22; border:1px solid #30363d; border-radius:20px; padding:40px; max-width:500px; width:90%;">
        <h3 style="color:#58a6ff; margin-top:0;">Kompüteri Yenilə</h3>
        <input type="text" id="update-pc-name" placeholder="Ad">
        <input type="number" id="update-pc-price" placeholder="Qiymət (AZN)">
        <textarea id="update-pc-desc" placeholder="Təsvir" style="height:100px;"></textarea>
        <div style="display:flex; gap:10px;">
            <button onclick="submitUpdateComputer()" style="flex:1; padding:12px; background:#58a6ff; border:none; border-radius:6px; color:#000; font-weight:bold; cursor:pointer;">Yadda Saxla</button>
            <button onclick="document.getElementById('updateComputerModal').style.display='none'" style="flex:1; padding:12px; background:transparent; border:1px solid #f87171; border-radius:6px; color:#f87171; font-weight:bold; cursor:pointer;">Ləğv Et</button>
        </div>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
