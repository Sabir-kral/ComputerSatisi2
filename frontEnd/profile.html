<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Profilim | TechStore</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="container">
    <div class="card">
        <div id="profile-view">
            <h2>İstifadəçi Profili</h2>
            <div class="user-info">
                <p><strong>Ad:</strong> <span id="view-name">...</span></p>
                <p><strong>Soyad:</strong> <span id="view-surname">...</span></p>
                <p><strong>Email:</strong> <span id="view-email">...</span></p>
            </div>
            
            <div class="button-group">
                <button class="btn-back" onclick="goBack()">← Geri</button>
                <button class="btn-blue" onclick="showUpdate()">Məlumatları Yenilə</button>
                <button class="btn-blue" style="background:#8957e5" onclick="getMyCart()">Səbətim</button>
                <button class="btn-danger" onclick="logout()">Çıxış Et</button>
                <button class="btn-danger btn-delete" onclick="deleteAccount()">Hesabı Həmişəlik Sil</button>
            </div>
        </div>

        <div id="my-computers-area" class="computers-list-container" style="display:none;">
            <h3 class="section-title">Səbətim</h3>
            <div id="pc-list-content"></div>

            <div id="checkout-summary" style="display:none; margin-top:20px; padding:20px; border-top:2px solid #30363d; text-align:right;">
                <h3 style="color:white;">Ümumi Cəm: <span id="total-price-display" style="color:#49fb35;">0</span> AZN</h3>
                <button class="btn-blue" style="background:#49fb35; color:#000; width:200px;" onclick="goToCheckout()">Sifarişi Tamamla</button>
            </div>
        </div>

        <div id="update-form" style="display:none;">
            <h3>Məlumatları Redaktə Et</h3>
            <input type="text" id="up-name" class="input-field" placeholder="Ad">
            <input type="text" id="up-surname" class="input-field" placeholder="Soyad">
            <input type="password" id="up-pass" class="input-field" placeholder="Yeni Şifrə">
            <button class="btn-blue" onclick="processUpdate()">Yadda Saxla</button>
            <button class="btn-danger" onclick="location.reload()">Ləğv Et</button>
        </div>
    </div>
    </div>

    <div id="orderModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#161b22; padding:30px; border-radius:15px; width:90%; max-width:400px; border:1px solid #30363d;">
            <h2 style="color:white; text-align:center;">Sifarişi Tamamla</h2>
            <p style="color:#8b949e; text-align:center;">Telefon nömrənizi daxil edin:</p>
            <input type="text" id="buyer-phone" placeholder="+994XXXXXXXXX" style="width:100%; padding:12px; margin:15px 0; border-radius:8px; border:1px solid #30363d; background:#0d1117; color:white;">
            <button onclick="confirmOrder()" style="width:100%; padding:12px; background:#238636; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Təsdiqlə</button>
            <button onclick="document.getElementById('orderModal').style.display='none'" style="width:100%; margin-top:10px; background:none; color:#8b949e; border:none; cursor:pointer;">Ləğv et</button>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
