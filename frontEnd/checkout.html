<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifariş | TechStore</title>
    <style>
        body { 
            background-color: #0d1117; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .checkout-card { 
            background: #161b22; 
            padding: 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid #30363d; 
        }
        .product-item { 
            background: #0d1117; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-radius: 6px; 
            border-left: 4px solid #58a6ff; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 15px 0; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: white; 
            box-sizing: border-box; 
        }
        input:focus {
            outline: 1px solid #58a6ff;
        }
        .btn-confirm { 
            width: 100%; 
            padding: 14px; 
            background: #49fb35; 
            color: #000; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-confirm:disabled {
            background: #6a737d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="checkout-card">
    <h2 style="text-align:center; color:#58a6ff;">🛒 Sifarişi Tamamla</h2>
    <div id="product-list"><p>Yüklənir...</p></div>
    <p style="text-align:right;">Cəmi: <span id="final-price" style="color:#49fb35; font-weight:bold;">0</span> AZN</p>

    <input type="tel" id="phone" placeholder="Telefon nömrəniz">
    <button class="btn-confirm" id="confirm-btn" onclick="confirmOrder()">✅ Təsdiqlə və Al</button>
    <div id="result-message" style="text-align:center; margin-top:15px;"></div>
</div>

<script>
    const API_BASE = "http://95.111.230.66:8080/api";

    let token = localStorage.getItem('accessToken');
    if (!token) {
        const activeUserStr = localStorage.getItem('activeUser');
        if (activeUserStr) {
            try {
                const activeUser = JSON.parse(activeUserStr);
                token = activeUser.accessToken;
            } catch(e) {
                console.error("User token oxunarkən xəta:", e);
            }
        }
    }

    if (!token) {
        location.href = 'index.html';
    }

    // "İndi Al" ilə tək məhsul gəlibsə, onu prioritet veririk
    const singleProduct = JSON.parse(localStorage.getItem("selectedPc") || "null");

    let checkoutItems = [];   // ekranda göstərmək üçün {id, name, price}
    let cartRawItems = [];    // backend-dən gələn xam cart item-lər (silmək üçün lazımdır)
    let totalAmount = 0;

    const listContainer = document.getElementById('product-list');

    async function loadCheckoutItems() {
        if (singleProduct) {
            checkoutItems = [singleProduct];
            renderItems();
            return;
        }

        try {
            const res = await fetch(`${API_BASE}/cart/my-cart`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) throw new Error("Cart yüklənmədi");

            cartRawItems = await res.json();

            if (!cartRawItems || cartRawItems.length === 0) {
                listContainer.innerHTML = "<p>Səbətiniz boşdur.</p>";
                document.getElementById('confirm-btn').disabled = true;
                return;
            }

            checkoutItems = cartRawItems.map(item => ({
                id: item.computer.id,
                name: item.computer.name,
                price: (Number(item.computer.price) || 0) * (item.quantity || 1),
                quantity: item.quantity
            }));

            renderItems();
        } catch (err) {
            console.error(err);
            listContainer.innerHTML = "<p>Səbət yüklənərkən xəta baş verdi.</p>";
        }
    }

    function renderItems() {
        totalAmount = 0;
        listContainer.innerHTML = checkoutItems.map(pc => {
            const price = parseFloat(pc.price) || 0;
            totalAmount += price;
            const qtyLabel = pc.quantity && pc.quantity > 1 ? ` x${pc.quantity}` : '';
            return `<div class="product-item"><span>${pc.name || 'Kompüter'}${qtyLabel}</span><b>${price} AZN</b></div>`;
        }).join('');

        document.getElementById('final-price').innerText = totalAmount.toFixed(2);
    }

    async function confirmOrder() {
        const phone = document.getElementById('phone').value.trim();
        const result = document.getElementById('result-message');
        const btn = document.getElementById('confirm-btn');

        if (!phone) { 
            alert("Nömrəni yazın!"); 
            return; 
        }

        btn.disabled = true;
        btn.innerText = 'İşlənilir...';
        result.innerText = "";

        try {
            const res = await fetch(`${API_BASE}/payments/checkout`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ 
                    phone: phone, 
                    computerIds: checkoutItems.map(p => p.id), 
                    amount: totalAmount 
                })
            });

            if (res.ok) {
                // Kompüterləri bazadan silirik (elan kimi)
                for (let pc of checkoutItems) {
                    try {
                        await fetch(`${API_BASE}/computers/${pc.id}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                    } catch (deleteErr) {
                        console.error(`${pc.id} silinərkən xəta:`, deleteErr);
                    }
                }

                if (singleProduct) {
                    localStorage.removeItem("selectedPc");
                } else {
                    // Backend-dəki cart-ı da təmizləyirik
                    for (let item of cartRawItems) {
                        try {
                            await fetch(`${API_BASE}/cart/remove?productId=${item.computer.id}`, {
                                method: 'DELETE',
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                        } catch (removeErr) {
                            console.error(`Cart item ${item.computer.id} silinərkən xəta:`, removeErr);
                        }
                    }
                }

                result.innerHTML = "<span style='color:#49fb35; font-weight:bold;'>✅ Uğurlu oldu! Gmail-inizə baxın.</span>";
                
                setTimeout(() => { 
                    location.href = 'index.html'; 
                }, 3000);

            } else {
                result.innerHTML = `<span style='color:#ff4a4a;'>Server xətası baş verdi!</span>`;
                btn.disabled = false;
                btn.innerText = '✅ Təsdiqlə və Al';
            }

        } catch (err) {
            result.innerHTML = "<span style='color:#ff4a4a;'>Şəbəkə xətası baş verdi!</span>";
            btn.disabled = false;
            btn.innerText = '✅ Təsdiqlə və Al';
        }
    }

    loadCheckoutItems();
</script>
</body>
</html>
